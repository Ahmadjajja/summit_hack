<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripCheck</title>
<style>
/* Two panes: chat on the left, your trip on the right; stacks on narrow screens. */
:root{
  --bg:#f4f6f6; --surface:#ffffff; --ink:#152022; --ink-2:#55656a; --line:#dbe3e4;
  --accent:#0e7c6b; --accent-ink:#ffffff; --user:#e4f1ee;
  --good:#1b7a3a; --good-t:#e0f3e6; --bad:#b42318; --bad-t:#fde7e4; --warn:#8a5a00; --warn-t:#fff4d6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1516; --surface:#162123; --ink:#e6eeee; --ink-2:#9fb0b3; --line:#2a3a3c;
  --accent:#4fd1b8; --accent-ink:#06201b; --user:#183330;
  --good:#6fd49a; --good-t:#123222; --bad:#ff8a7a; --bad-t:#3a1a16; --warn:#f2c14e; --warn-t:#33290f;
  color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:19px;margin:0;letter-spacing:-.01em}
header .mode{font:12px var(--mono);color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--ink-2)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{flex-shrink:0;max-width:760px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:0;overflow-x:auto}
.msg.user{align-self:flex-end;background:var(--user);border-color:transparent;white-space:pre-wrap}
.msg.err{border-color:var(--bad);background:var(--bad-t)}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0 8px;padding-left:20px}
.msg table{border-collapse:collapse;font:12px var(--mono);margin:6px 0}
.msg td,.msg th{border:1px solid var(--line);padding:3px 8px;text-align:right}
.msg code{font:13px var(--mono);background:var(--bg);padding:1px 5px;border-radius:4px}
.steps{font:12px var(--mono);color:var(--ink-2);margin-top:8px}
.thinking{color:var(--ink-2);font-style:italic}
.dock{border-top:1px solid var(--line);background:var(--surface);padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.approve{display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--good-t)}
.approve.show{display:flex}
.pay{background:var(--warn-t)}.pay span{color:var(--warn)}
.pay a{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;text-decoration:none}
.msg a{color:var(--accent)}
.approve span{flex:1;color:var(--good);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:13px;padding:5px 10px;border-radius:999px}
.row{display:flex;gap:10px}
textarea{flex:1;resize:none;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
aside{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
aside h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.tile small{color:var(--ink-2)}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.bk .t{font-weight:600}.bk .s{font-size:13px;color:var(--ink-2)}
.bk .c{text-align:right;font-variant-numeric:tabular-nums}
.pill{font:11px var(--mono);text-transform:uppercase;padding:1px 6px;border-radius:4px;justify-self:end;align-self:start}
.pill.active{background:var(--good-t);color:var(--good)}.pill.cancelled{background:var(--bad-t);color:var(--bad)}
.bk.cancelled .t,.bk.cancelled .c{text-decoration:line-through;color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:14px}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .chat{border-right:0}
  aside{max-height:38vh;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
  <h1>TripCheck</h1>
  <div class="mode" id="mode">connecting…</div>
  <button id="reset" type="button">New trip</button>
</header>
<main>
  <section class="chat">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="dock">
      <div class="approve" id="approveBar">
        <span>Verified. Nothing is booked or paid until you approve.</span>
        <button class="primary" id="approve" type="button">Approve</button>
      </div>
      <div class="approve pay" id="payBar">
        <span id="payText">Approved. Pay on Stripe (test mode) to book.</span>
        <a id="payLink" href="#" target="_blank" rel="noopener">Pay with Stripe</a>
      </div>
      <div class="chips" id="chips"></div>
      <form class="row" id="form">
        <textarea id="input" rows="1" placeholder="Describe your trip, or ask for a change…" aria-label="Message"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
      </form>
    </div>
  </section>
  <aside>
    <h2>Your trip</h2>
    <div class="totals">
      <div class="tile"><small>Paid</small><b id="paid">$0</b></div>
      <div class="tile"><small>Refunded</small><b id="refunded">$0</b></div>
    </div>
    <div id="bookings"><p class="empty">No bookings yet.</p></div>
  </aside>
</main>
<script>
const STEPS = [
  ["Book the Japan trip", "Japan Nov 15-22, Tokyo then Osaka for the dev events, budget $3,500"],
  ["Live search: Lisbon + Porto", "Lisbon then Porto Dec 4-9 from Boston, with a good dinner, budget $3,000"],
  ["Stay 2 more nights in Osaka", "Stay 2 more nights in Osaka"],
  ["Cancel my Osaka hotel", "Cancel my Osaka hotel"],
  ["Cancel the whole trip", "Cancel the whole trip"],
  ["Try: cancel my car rental", "Cancel my car rental"],
  ["Try: budget $1,500", "Japan Nov 15-22, Tokyo then Osaka, budget $1,500"],
];
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input");
let busy = false;

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function inline(s){return esc(s).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>")}
function md(text){
  const out=[]; let list=null, table=null;
  const flush=()=>{if(list){out.push("<ul>"+list.join("")+"</ul>");list=null}
                   if(table){out.push("<table>"+table.join("")+"</table>");table=null}};
  for(const raw of text.split("\n")){
    const line=raw.trimEnd();
    if(/^\|[-| ]+\|$/.test(line)) continue;
    if(line.startsWith("|")){ if(list){out.push("<ul>"+list.join("")+"</ul>");list=null}
      const cells=line.slice(1,-1).split("|").map(c=>inline(c.trim()));
      (table=table||[]).push("<tr><td>"+cells.join("</td><td>")+"</td></tr>"); continue;}
    const li=line.match(/^\s*(?:-|\d+\.)\s+(.*)$/);
    if(li){ if(table){out.push("<table>"+table.join("")+"</table>");table=null}
      (list=list||[]).push("<li>"+inline(li[1])+"</li>"); continue;}
    flush(); if(line) out.push("<p>"+inline(line)+"</p>");
  }
  flush(); return out.join("");
}
function add(cls, html){const d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(text){add("user",esc(text))}
function money(n){return "$"+Math.round(n).toLocaleString()}

function renderTrip(t){
  if(!t) return;
  $("mode").textContent=`SubQ: ${t.mode.subq} · Verifier: ${t.mode.gemini} · Search: ${t.mode.search} · Pay: ${t.mode.pay} · Clock: ${t.mode.now}`;
  if(t.notice){const m=add("",md(t.notice));}
  $("payBar").classList.toggle("show", !!t.checkout);
  if(t.checkout){$("payLink").href=t.checkout.url;$("payText").textContent=`Approved. Pay ${money(t.checkout.amount_usd)} on Stripe (test mode, card 4242 4242 4242 4242) to book.`}
  pollWhilePaying(!!t.checkout);
  $("paid").textContent=money(t.paid_usd); $("refunded").textContent=money(t.refunded_usd);
  $("approveBar").classList.toggle("show", t.awaiting_approval);
  const b=$("bookings");
  if(!t.bookings.length){b.innerHTML='<p class="empty">No bookings yet.</p>';return}
  b.innerHTML=t.bookings.map(x=>`<div class="bk ${x.status}" style="margin-bottom:8px">
     <span class="t">${esc(x.label||x.id)}</span><span class="c">${money(x.cost_usd)}</span>
     <span class="s">${esc(x.kind)} · ${esc(x.where||"")} · ${esc(x.when||"")}</span><span class="pill ${x.status}">${x.status}</span>
   </div>`).join("");
}
let poll=null;
function pollWhilePaying(on){
  if(on&&!poll) poll=setInterval(()=>fetch("/api/trip").then(r=>r.json()).then(renderTrip).catch(()=>{}),2500);
  if(!on&&poll){clearInterval(poll);poll=null}
}
function setBusy(on){busy=on;["send","approve","reset"].forEach(i=>$(i).disabled=on);
  document.querySelectorAll("#chips button").forEach(b=>b.disabled=on)}

async function call(path, body){
  setBusy(true);
  const wait=add("", '<span class="thinking">'+(path==="/api/approve"?"Booking and paying through the locker room…":"Planning and verifying with SubQ + Gemini… (10–30 s; up to a minute when it searches the web for a new place)")+'</span>');
  try{
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    const d=await r.json(); wait.remove();
    const m=add(d.error?"err":"", md(d.reply||""));
    if(d.steps&&d.steps.length){const s=document.createElement("div");s.className="steps";s.textContent=d.steps.join("  →  ");m.appendChild(s)}
    renderTrip(d.trip);
  }catch(e){wait.remove();add("err","Couldn't reach the TripCheck server. Is <code>python web.py</code> still running?")}
  finally{setBusy(false);input.focus()}
}
function send(text){text=text.trim(); if(!text||busy) return; say(text); input.value=""; call("/api/message",{text})}

$("form").addEventListener("submit",e=>{e.preventDefault();send(input.value)});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input.value)}});
$("approve").addEventListener("click",()=>{if(busy)return;say("approve");call("/api/approve")});
$("reset").addEventListener("click",async()=>{if(busy)return;log.innerHTML="";await call("/api/reset");greet()});
STEPS.forEach(([label,text])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=()=>send(text);$("chips").appendChild(b)});

function greet(){add("",md("**Hi, I'm TripCheck.** Tell me about your trip. I'll plan it, a separate AI checks the plan, and nothing is booked or paid until you press **Approve**.\n\nUse the buttons below to run the demo: book the Japan trip, then change it mid-trip. For anywhere else, I search the web live with Fetch.ai ASI:One."))}
fetch("/api/trip").then(r=>r.json()).then(renderTrip).catch(()=>{$("mode").textContent="server not reachable"});
greet(); input.focus();
</script>
</body>
</html>
